name: Build gs-agent (Beacon)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run native agent regression tests
        run: |
          make -C beacon test HOST_CXX=g++

      - name: Build gs-agent.exe via Docker Builder
        run: |
          ./scripts/build-docker.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gs-agent-windows-x64
          path: beacon/gs-agent.exe
