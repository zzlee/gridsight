# ==============================================================================
# GridSight Teacher Console - Docker Compose Deployment
# ==============================================================================
services:
  teacher-console:
    image: gridsight-console:latest
    build:
      context: .
      dockerfile: Dockerfile.console
    container_name: gridsight-console
    network_mode: host
    restart: unless-stopped
    environment:
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - MULTICAST_IP=239.255.42.99
      - BROADCAST_MULTICAST_IP=239.255.42.100
