# ==============================================================================
# GridSight Teacher Console - Docker Compose Deployment
# ==============================================================================
services:
  teacher-console:
    image: gridsight-console:latest
    build:
      context: .
      dockerfile: Dockerfile.console
    container_name: gridsight-console
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./beacon/gs-agent.exe:/app/downloads/gs-agent.exe:ro
      - ./tools:/app/tools:ro
